name: Static site checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required public files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s manifest.webmanifest
          test -s sw.js
      - name: Check essential document metadata
        run: |
          grep -qi '<title>WorldScope News' index.html
          grep -q 'name="description"' index.html
          grep -q 'rel="manifest"' index.html
      - name: Check no public founder identity is embedded
        run: |
          ! grep -qi 'Ibitoye Oluwasegun Emmanuel' index.html
          ! grep -qi 'founder-portrait' index.html
